server:
  # Small pools on purpose. Each test JVM boots a full server for each of many test classes in turn,
  # and Dropwizard's default maxThreads of 1024 per server once brought a JVM close enough to its
  # thread ceiling that a later class failed to start with Netty's "failed to create a child event
  # loop". These tests issue a handful of sequential requests each, so a few threads is ample, and the
  # headroom is worth more than the concurrency.
  # Each class stops its server when it ends. Dropwizard's default grace period held every stop for
  # a second while Jetty waited for idle connections the class no longer uses.
  shutdownGracePeriod: 0s
  minThreads: 4
  maxThreads: 16
  applicationConnectors:
  - type: http
    useForwardedHeaders: true
    bindHost: 127.0.0.1
  adminConnectors:
  - type: http
    bindHost: 127.0.0.1
logging:
  level: INFO
  loggers:
    org.metadatacenter: DEBUG
  appenders:
    - type: console
      threshold: ALL
      timeZone: UTC
      target: stdout
