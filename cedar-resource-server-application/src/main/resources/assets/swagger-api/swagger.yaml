  /command/index-job-status/{jobId}:
    get:
      description: "Report what became of the rebuild named by the identifier its\
        \ command returned. Reading an index instead answers a different question:\
        \ it says what the last job over that index did, which is the same job only\
        \ until another command runs. Jobs are held in memory, so an identifier from\
        \ before the last restart, or one that twenty later jobs have pushed out,\
        \ is no longer known."
      operationId: indexJobStatusById
      parameters:
      - description: "Job identifier, as returned when the rebuild was queued."
        in: path
        name: jobId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexJobStatus"
          description: The job and its current state
