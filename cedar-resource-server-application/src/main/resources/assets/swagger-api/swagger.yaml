          description: New name of the resource.
    ResourceAclUpdateRequest:
      type: object
      additionalProperties: false
      description: |
        Complete replacement for a resource's direct grants. A user or group is named by its `@id`
        alone. The report this replaces is wider — a grant comes back carrying the user's name and
        email — so that document is refused rather than narrowed, and a client sends what this
        schema declares.
      properties:
        groupPermissions:
          type: array
          items:
            $ref: "#/components/schemas/ResourceGroupGrant"
        owner:
          allOf:
          - $ref: "#/components/schemas/CedarUserReference"
          deprecated: true
          description: Accepted for compatibility when it names the current owner.
            Ownership is changed through the separate transfer operation.
        userPermissions:
          type: array
          items:
            $ref: "#/components/schemas/ResourceUserGrant"
      required:
      - groupPermissions
      - userPermissions
