      enum:
      - viewer
      - editor
      - manager
    ResourceSummary:
      type: object
      additionalProperties: true
      description: |
        A folder or artifact summary. The exact additional properties depend on the resource type
        and on the fields requested by the caller.
      properties:
        '@id':
          type: string
          format: uri
        activeUserCanRead:
          type: boolean
        createdOnTS:
          type: integer
          format: int64
        lastUpdatedOnTS:
          type: integer
          format: int64
        resourceType:
          type: string
          enum:
