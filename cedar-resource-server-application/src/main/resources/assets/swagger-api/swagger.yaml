  /command/regenerate-rules-index:
    post:
      deprecated: true
      description: "Deprecated, and does not do what its name says. The rules index\
        \ holds association rules mined by the value recommender from template instances;\
        \ the resource server cannot produce those documents. This command creates\
        \ an empty index, points the alias at it and deletes the old index, so it\
        \ discards every rule in the system and recommendations stop returning results.\
        \ The force parameter is read but has no effect. Use /command/generate-empty-rules-index\
        \ if emptying the index is what you want. To repopulate the index, call the\
        \ value recommender's /command/generate-rules/{template_id} for each template.\
        \ The work is asynchronous, so this answers as soon as the job is queued rather\
        \ than once it has been done: 202, the job's identifier, and a Location header\
        \ naming where to poll it. A 200 would say the work had finished, which is\
        \ the one thing this response cannot mean."
      operationId: regenerateRulesIndex
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/ForceRequest"
        description: Force or not
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexJobStatus"
          description: The rebuild was queued
          headers:
            Location:
              description: Where to poll this job's status.
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: A rebuild of this index is already running
          headers:
            Location:
              description: Where to poll the running job's status.
              schema:
                type: string
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: "Regenerate rules index. Deprecated: this command empties the rules\
        \ index."
      tags:
      - Command
      - Administration
  /command/regenerate-search-index:
