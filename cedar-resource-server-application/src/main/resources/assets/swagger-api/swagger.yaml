openapi: 3.0.1
info:
  description: |
    Better Metadata - Better Science

    Mutable resources use strong ETags for optimistic concurrency. Read the resource (or its
    permissions) and send the returned ETag in `If-Match` when replacing or deleting it. A missing
    required precondition returns 428; a stale or malformed validator returns 412. `If-Match: *`
    accepts whichever revision currently exists and therefore deliberately gives up lost-update
    protection. Comma-separated strong validators are also accepted. Representation suffixes such
    as `"7-json"`, `"7-yaml"`, and `"7-resource-record"` identify different bytes of the same
    stored revision and are valid write preconditions.

    See the [CEDAR REST APIs guide](https://metadatacenter.readthedocs.io/en/latest/developer-guide/cedar-rest-apis/)
    for authentication, request examples, and complete ETag guidance.
  title: CEDAR Resource Server API
  version: 2.9.12-SNAPSHOT
tags:
- name: Templates
- name: Template Elements
- name: Template Fields
- name: Template Instances
- name: Folders
- name: Folder Contents
- name: Categories
paths:
  /:
    get:
      operationId: showInfo
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The service name and links to its API documentation
      summary: Describe this CEDAR service
      tags:
      - Service
  /categories:
    get:
      description: Get the list of all categories.
      operationId: getAllCategories
      parameters:
      - description: Paging limit
        in: query
        name: limit
        schema:
          type: integer
          format: int32
      - description: Paging offset
        in: query
        name: offset
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
          description: One page of categories
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Get all categories
      tags:
      - Categories
    post:
      description: Create a category.
      operationId: createCategory
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CategoryCreateRequest"
        description: The category to be created
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDetails"
          description: A category and what the current user may do with it
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: A sibling category with the same name already exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Create a category
      tags:
      - Categories
