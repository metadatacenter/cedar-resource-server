        in: path
        name: category_id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Successful operation (no content)
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Category still has children or attached artifacts
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Delete a category
      tags:
      - Categories
    get:
      description: Get a category.
      operationId: findCategory
      parameters:
      - description: "Category identifier. Example: https://repo.metadatacenter.org/categories/8bc64ab5-df6b-48c8-8c61-6c016245918e"
        in: path
        name: category_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDetails"
          description: A category and what the current user may do with it
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Get a category
      tags:
      - Categories
    put:
      description: Update a category.
      operationId: updateCategory
      parameters:
      - $ref: "#/components/parameters/IfMatch"
      - description: "Category identifier. Example: https://repo.metadatacenter.org/categories/8bc64ab5-df6b-48c8-8c61-6c016245918e"
        in: path
        name: category_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CategoryUpdateRequest"
        description: The category to be updated
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDetails"
          description: The updated category and what the current user may do with
            it
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: A sibling category already has the requested name
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Update a category
      tags:
      - Categories
  /categories/{category_id}/permissions:
    get:
      description: "Get the category owner, direct user grants and direct group grants.\
        \ Any user with the readCategory capability may read this response."
      operationId: getCategoryPermissions
      parameters:
      - description: "Category identifier. Example: https://repo.metadatacenter.org/categories/8bc64ab5-df6b-48c8-8c61-6c016245918e"
        in: path
        name: category_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryPermissions"
          description: Category permissions
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Get category permissions
      tags:
      - Categories
      - Permissions
    put:
      description: Atomically replace the direct user and group role grants. This
        operation does not change ownership or inherited roles. The caller must have
        the manageGrants capability.
      operationId: updateCategoryPermissions
      parameters:
      - $ref: "#/components/parameters/IfMatch"
      - description: "Category identifier. Example: https://repo.metadatacenter.org/categories/8bc64ab5-df6b-48c8-8c61-6c016245918e"
        in: path
        name: category_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CategoryAclUpdateRequest"
        description: Complete replacement for the category's direct grants.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryPermissions"
          description: Updated category permissions
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Replace category grants
      tags:
      - Categories
      - Permissions
  /command/annotations/doi:
    post:
      description: "Set the DOI annotation of an artifact. The user must have the\
        \ updateResource capability on the artifact. The resource type must support\
        \ DOIs, and an existing DOI can not be altered."
      operationId: setDOI
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/SetDoiRequest"
        description: The artifact and the DOI to record
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactRecord"
          description: "The artifact, carrying its DOI"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Set the DOI of an artifact
      tags:
      - Command
  /command/attach-categories:
    post:
      description: Attach a list of existing categories to an existing artifact. The
        user must have the updateResource capability on the artifact and the attachCategory
        capability on every category. Authorization is completed before any category
        is attached.
      operationId: attachCategoriesToArtifact
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CategoryAttachListRequest"
        description: Parameters of the attach operation
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDetails"
          description: "The artifact's details, as they stood before the categories\
            \ were attached"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Attach multiple categories to an artifact
      tags:
      - Command
      - Categories
      - Category Operations
  /command/attach-category:
    post:
      description: Attach an existing category to an existing artifact. The user must
        have the updateResource capability on the artifact and the attachCategory
        capability on the category.
      operationId: attachCategoryToArtifact
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CategoryAttachRequest"
        description: Parameters of the attach operation
        required: true
      responses:
