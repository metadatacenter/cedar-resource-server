          $ref: "#/components/schemas/ResourceRole"
      required:
      - group
      - role
    ResourceListResponse:
      type: object
      additionalProperties: true
      description: |
        One page of folders and artifact summaries. Optional category, path, and continuation
        properties appear only for query modes that produce them.
      properties:
        '@context':
          type: object
          additionalProperties:
            type: string
        categoryName:
          type: string
          nullable: true
        categoryPath:
          type: array
          items:
            type: object
            additionalProperties: true
          nullable: true
        continuation:
          type: string
          description: Opaque token for the next deep-search page; absent at the end.
        currentOffset:
          type: integer
          format: int64
        nodeListQueryType:
          type: string
        paging:
          type: object
          additionalProperties:
            type: string
            format: uri
        pathInfo:
          type: array
          items:
            $ref: "#/components/schemas/ResourceSummary"
          nullable: true
        request:
          $ref: "#/components/schemas/NodeListRequest"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ResourceSummary"
        totalCount:
          type: integer
          format: int64
      required:
      - '@context'
      - currentOffset
      - nodeListQueryType
      - resources
      - totalCount
    ResourcePermissions:
      type: object
      description: "The owner of a folder or artifact, together with the user and\
        \ group grants recorded directly on it. A role that reaches the resource through\
        \ a folder above it is not listed here."
      properties:
        groupPermissions:
          type: array
          description: Every role granted directly to a group.
          items:
            $ref: "#/components/schemas/ResourceGroupGrant"
        owner:
          $ref: "#/components/schemas/CedarUserReference"
        userPermissions:
          type: array
          description: Every role granted directly to a user.
          items:
            $ref: "#/components/schemas/ResourceUserGrant"
      required:
      - groupPermissions
      - owner
      - userPermissions
    ResourceRole:
      type: string
      description: A role granted to a user or a group on an artifact or a folder.
