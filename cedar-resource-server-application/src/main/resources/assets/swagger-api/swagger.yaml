  /search:
    get:
      description: "Search resources using different criteria. All of the parameters\
        \ are optional, but you need to provide at least one search criteria. The\
        \ parameters can be combined, but not all of the combinations will work. You\
        \ can see the type of the executed search in the response body."
      operationId: search
      parameters:
      - description: Search term. It will be looked up in the artifact names
        in: query
        name: q
        schema:
          type: string
      - description: "Artifact id. If passed, only the artifact or folder with the\
          \ given id will be returned."
        in: query
        name: id
        schema:
          type: string
      - description: "Resource types as comma separated values. The allowed values\
          \ are: 'folder', 'field', 'element', 'template', 'instance'"
        in: query
        name: resource_types
        schema:
          type: string
      - description: "Version selector. It is only handled for template-fields, template-elements\
          \ and templates. The allowed values are: 'latest', 'all'"
        in: query
        name: version
        schema:
          type: string
      - description: "Publication status selector. It is only handled for template-fields,\
          \ template-elements and templates. The allowed values are: 'bibo:draft',\
          \ 'bibo:published', 'all'"
        in: query
        name: publication_status
        schema:
          type: string
      - description: Template identifier. All the instances with this template id
          will be returned
        in: query
        name: is_based_on
        schema:
          type: string
      - description: "Sort field names as comma separated values. Prepending a field\
          \ with '-' means descending order on that field. The allowed values are:\
          \ 'name', 'lastUpdatedOnTS', 'createdOnTS'"
        in: query
        name: sort
        schema:
          type: string
      - description: Paging limit
        in: query
        name: limit
        schema:
          type: integer
          format: int32
      - description: Paging offset
        in: query
        name: offset
        schema:
          type: integer
          format: int32
      - description: Sharing modifier for the search. Only the artifacts and folder
          matching the criteria will be returned.
        in: query
        name: sharing
        schema:
          type: string
      - description: "Search mode. The only value currently supported is 'special-folders'.\
          \ If passed, the list of special folders will be returned ('/Shared', etc.)"
        in: query
        name: mode
        schema:
          type: string
      - description: Category Id. All the artifacts in the given category will be
          returned.
        in: query
        name: category_id
        schema:
          type: string
      - description: Continuation from a previous answer. Only /search-deep serves
          one; this route refuses it rather than answering the first page as though
          the caller had never asked to carry on.
        in: query
        name: continuation
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListResponse"
          description: A page of resources matching the search
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Search resources
      tags:
      - Search
      - Template Fields
      - Template Elements
      - Templates
      - Template Instances
      - Folders
      - Folder Contents
      - Versioning
  /search-deep:
    get:
      description: "Search resources using different criteria. This call can go further\
        \ than 10.000 resources, by offset or, for a whole result set, by following\
        \ the continuation each answer carries. It is not intended for everyday use.\
        \ All of the parameters are optional, but you need to provide at least one\
        \ search criteria. The parameters can be combined, but not all of the combinations\
        \ will work. You can see the type of the executed search in the response body."
      operationId: searchDeep
      parameters:
      - description: Search term. It will be looked up in the artifact names
        in: query
        name: q
        schema:
          type: string
      - description: "Artifact id. If passed, only the artifact or folder with the\
          \ given id will be returned."
        in: query
        name: id
        schema:
          type: string
      - description: "Resource types as comma separated values. The allowed values\
          \ are: 'folder', 'field', 'element', 'template', 'instance'"
        in: query
        name: resource_types
        schema:
          type: string
      - description: "Version selector. It is only handled for template-fields, template-elements\
          \ and templates. The allowed values are: 'latest', 'all'"
        in: query
        name: version
        schema:
          type: string
      - description: "Publication status selector. It is only handled for template-fields,\
          \ template-elements and templates. The allowed values are: 'bibo:draft',\
          \ 'bibo:published', 'all'"
        in: query
        name: publication_status
        schema:
          type: string
      - description: Template identifier. All the instances with this template id
          will be returned
        in: query
        name: is_based_on
        schema:
          type: string
      - description: "Sort field names as comma separated values. Prepending a field\
          \ with '-' means descending order on that field. The allowed values are:\
          \ 'name', 'lastUpdatedOnTS', 'createdOnTS'"
        in: query
        name: sort
        schema:
          type: string
      - description: Paging limit
        in: query
        name: limit
        schema:
          type: integer
          format: int32
      - description: "Paging offset. This call walks to the offset a page at a time,\
          \ so a configured maximum bounds the walk; a larger offset is refused with\
          \ a 400."
        in: query
        name: offset
        schema:
          type: integer
          format: int32
      - description: Sharing modifier for the search. Only the artifacts and folder
          matching the criteria will be returned.
        in: query
        name: sharing
        schema:
          type: string
      - description: "Search mode. The only value currently supported is 'special-folders'.\
          \ If passed, the list of special folders will be returned ('/Shared', etc.)"
        in: query
        name: mode
        schema:
          type: string
      - description: Category Id. All the artifacts in the given category will be
          returned.
        in: query
        name: category_id
        schema:
          type: string
      - description: "Where to carry on from, instead of an offset. Pass 'start' for\
          \ the first page, then the 'continuation' each answer carries until an answer\
          \ has none, which is the end of the results. A page costs the same wherever\
          \ it falls, so this is the way to read a whole result set. The query, filters,\
          \ sort and user must stay as they were, and the walk reads one snapshot\
          \ of the index, so rows created or deleted while it runs do not move it."
        in: query
        name: continuation
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListResponse"
          description: A page of resources matching the search
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Search resources
      tags:
      - Search
      - Template Fields
      - Template Elements
      - Templates
      - Template Instances
      - Folders
      - Folder Contents
      - Versioning
