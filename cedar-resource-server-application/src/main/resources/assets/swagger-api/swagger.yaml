  /command/generate-empty-rules-index:
    post:
      description: "Regenerate rules index. This is an administrative command, you\
        \ need special permission to run it. The old index will be deleted and replaced\
        \ by a new empty one. The recommendations will work, but will not return results,\
        \ since the index will be empty. The work is asynchronous, so this answers\
        \ as soon as the job is queued rather than once it has been done: 202, the\
        \ job's identifier, and a Location header naming where to poll it. A 200 would\
        \ say the work had finished, which is the one thing this response cannot mean."
      operationId: generateEmptyRulesIndex
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexJobStatus"
          description: The rebuild was queued
          headers:
            Location:
              description: Where to poll this job's status.
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: A rebuild of this index is already running
          headers:
            Location:
              description: Where to poll the running job's status.
              schema:
                type: string
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Empty rules index.
      tags:
      - Command
      - Administration
