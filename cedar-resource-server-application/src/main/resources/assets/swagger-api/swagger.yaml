components:
  headers:
    ETag:
      description: Strong validator for the returned representation and its stored
        revision.
      example: '"7"'
      schema:
        type: string
  parameters:
    IfMatch:
      description: |
        Strong ETag returned by the corresponding GET. `*` accepts any current revision; a
        comma-separated list succeeds when any supplied strong validator names the current stored
        revision. Weak, stale, and malformed validators fail with 412.
      example: '"7"'
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    IfMatchForCreateOrReplace:
      description: |
        Required when the identifier already exists and the PUT replaces it; omit it when creating
        a resource with a new client-supplied identifier. If supplied for an absent resource, the
        request fails with 412 rather than creating it. Use the strong ETag returned by GET. `*`
        accepts any current revision that still exists and deliberately gives up lost-update protection.
      example: '"7"'
      in: header
      name: If-Match
      required: false
      schema:
        type: string
  responses:
    PreconditionFailed:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CedarError"
      description: |
        The supplied If-Match value is stale, weak, or malformed. When a current revision exists,
        the error body's `parameters.currentETag` identifies it.
    PreconditionRequired:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CedarError"
      description: This operation requires the current resource ETag in If-Match.
  schemas:
    ArtifactCounts:
      type: object
      properties:
        element:
          type: integer
          format: int64
        field:
          type: integer
          format: int64
        instance:
          type: integer
          format: int64
        template:
          type: integer
          format: int64
    ArtifactDetails:
      allOf:
      - $ref: "#/components/schemas/ArtifactRecord"
      - type: object
        properties:
          currentUserPermissions:
            $ref: "#/components/schemas/CurrentUserResourcePermissions"
          isBasedOn:
            allOf:
            - $ref: "#/components/schemas/ResourceSummary"
            description: Summary of the template an instance was filled in against.
            nullable: true
        required:
        - currentUserPermissions
      description: An artifact together with what the current user may do with it.
    ArtifactDocument:
      type: object
      additionalProperties: true
      description: "An open CEDAR JSON-LD artifact: the identity and provenance keys\
        \ that templates, elements, fields and instances all carry. Kind-specific\
        \ keys are described by SchemaArtifactDocument and InstanceArtifactDocument;\
        \ the authoritative definition of each kind is the CEDAR model's JSON Schema."
      externalDocs:
        description: The CEDAR template model
        url: https://more.metadatacenter.org/tools-training/outreach/cedar-template-model
      properties:
        '@context':
          type: object
          additionalProperties: true
          description: JSON-LD context for the keys the artifact uses.
        '@id':
          type: string
          format: uri
          description: "The artifact's IRI. The server mints it on a POST, so a body\
            \ sent to POST carries none; a body sent to PUT carries the IRI of the\
            \ path."
        oslc:modifiedBy:
          type: string
          format: uri
          description: IRI of the user who last changed it.
        pav:createdBy:
          type: string
          format: uri
          description: IRI of the user who created it.
        pav:createdOn:
          type: string
          format: date-time
          description: When the artifact was created.
        pav:lastUpdatedOn:
          type: string
          format: date-time
          description: When the artifact was last changed.
        schema:description:
          type: string
          description: Description shown with the name.
        schema:name:
          type: string
          description: Display name.
    ArtifactRecord:
      allOf:
      - $ref: "#/components/schemas/FilesystemResourceRecord"
      - type: object
        properties:
          bibo:status:
            type: string
            enum:
            - bibo:draft
            - bibo:published
            nullable: true
          doi:
            type: string
            description: |
              The artifact's DOI, once one has been set. The graph record and the report carry
              it. The details response does not.
            nullable: true
          isLatestDraftVersion:
            type: boolean
            nullable: true
          isLatestPublishedVersion:
            type: boolean
            nullable: true
          isLatestVersion:
            type: boolean
            nullable: true
          pav:derivedFrom:
            type: string
            format: uri
            nullable: true
          pav:previousVersion:
            type: string
            format: uri
            nullable: true
          pav:version:
            type: string
            nullable: true
          schema:isBasedOn:
            type: string
            format: uri
            description: IRI of the template an instance was filled in against.
            nullable: true
      description: |
        An artifact as the workspace graph holds it. Templates, elements and fields carry the
        versioning keys; an instance carries the template it is based on instead.
    ArtifactReport:
      allOf:
      - $ref: "#/components/schemas/ArtifactDetails"
      - type: object
        properties:
          categories:
            type: array
            description: "One entry per attached category, each the path from the\
              \ root category to it."
            items:
              type: array
              items:
                $ref: "#/components/schemas/CategoryExtract"
            nullable: true
          derivedFrom:
            allOf:
            - $ref: "#/components/schemas/ResourceSummary"
            description: Summary of the artifact this one was copied from.
            nullable: true
          trustedBy:
            type: string
            description: "The trusted folder the artifact sits under, when it sits\
              \ under one."
            nullable: true
          versions:
            type: array
            description: "The artifact's version history, newest first. Present for\
              \ versioned artifacts."
            items:
              $ref: "#/components/schemas/ResourceSummary"
            nullable: true
      description: |
        An artifact's details together with what surrounds it: where it sits, what it was derived
        from, its other versions, and the categories it is filed under.
    AuthUserCallbackRequest:
      type: object
      additionalProperties: false
      description: |
        The Keycloak authentication event and the user it concerns. Provisioning runs only when the
        event's client identifier names CEDAR's own Keycloak client.
      properties:
        event:
          type: object
          additionalProperties: true
          description: The event as the Keycloak event listener serializes it. Only
            `clientId` is read.
          properties:
            clientId:
              type: string
        eventUser:
          type: object
          description: The user to provision.
          properties:
            '@id':
              type: string
              format: uri
            email:
              type: string
            firstName:
              type: string
            lastName:
              type: string
          required:
          - '@id'
      required:
      - event
