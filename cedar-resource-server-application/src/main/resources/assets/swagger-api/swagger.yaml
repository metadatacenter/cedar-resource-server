                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Attach category to an artifact
      tags:
      - Command
      - Categories
      - Category Operations
  /command/auth-user-callback:
    post:
      description: "Endpoint called by the Keycloak Event Listener. Creates the CEDAR\
        \ objects related to a user (home folder, group membership) upon authentication.\
        \ The caller must hold the user administration permission, since the user\
        \ to provision is named in the request body."
      operationId: authUserCallback
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/AuthUserCallbackRequest"
        description: The authentication event and the user it concerns
        required: true
      responses:
        "201":
          description: The user's objects were provisioned. The response carries no
            body.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Authentication user callback
      tags:
      - Command
  /command/check-update-template/{template_id}:
    post:
      description: "Check whether an existing template can be updated with the supplied\
        \ template definition. The destructive and non-destructive changes between\
        \ the stored template and the supplied template are computed, and the number\
        \ of affected instances is reported."
      operationId: checkUpdateTemplate
      parameters:
      - description: Template identifier.
        in: path
        name: template_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/SchemaArtifactDocument"
        description: The template definition the stored template would be replaced
          by
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateUpdateCheck"
          description: "Whether the template can be updated, and what updating it\
            \ would cost"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Check whether a template can be updated
      tags:
      - Command
      - Versioning
  /command/convert:
    post:
      description: Convert the resource supplied in the request body to the requested
        output format.
      operationId: convertResource
      parameters:
      - description: "Output format type to display the content of the template instance.\
          \ The allowed values are: 'jsonld', 'json', 'rdf-nquad'"
        in: query
        name: format
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/ArtifactDocument"
        description: The artifact to convert
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDocument"
            application/n-quads:
              schema:
                type: string
                description: "The artifact as RDF N-Quads, one statement per line."
          description: "The converted artifact, in the requested format"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Convert a resource
      tags:
      - Command
  /command/copy-artifact-to-folder:
    post:
      description: "Copy artifact to a given folder. A copy of the given artifact\
        \ will be created in the given folder, with a new name Only artifacts (fields,\
        \ elements, templates, instances) can be copied."
      operationId: copyResourceToFolder
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CopyRequest"
        description: Parameters of the copy operation
        required: true
      responses:
        "200":
          description: "Reached only when the artifact server returns no entity for\
            \ the copy, which leaves nothing to return. The response carries no body."
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDocument"
          description: "The copy, as the artifact server stored it"
          headers:
            Location:
              description: Where the copy can be read.
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
