  /command/inclusions-subgraph-update:
    post:
      description: "Propagate a change to the given artifact across the tree of affected\
        \ artifacts, updating each referencing artifact on the artifact server. The\
        \ caller needs the readResource capability on the artifact that changed and\
        \ the updateResource capability on every artifact selected for update. If\
        \ the caller lacks either capability, the whole request is refused and nothing\
        \ is written. The response reports what became of each target."
      operationId: updateInclusionSubgraph
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/InclusionSubgraphRequest"
        description: "The artifact that changed, and the elements and templates to\
          \ consider"
        required: true
      responses:
