  /command/reset-rules-index-job:
    post:
      description: "Only one rebuild or import runs at a time, and a job that never\
        \ returns would otherwise hold its claim until the server restarted, refusing\
        \ every later command with a conflict naming a job that is not running. A\
        \ claim is believed for six hours; past that the status reports it as overdue\
        \ and this command takes it back, so the next command can run. It does not\
        \ stop the abandoned job — nothing can — so run it only once the log shows\
        \ that job has stopped making progress. A claim within its deadline is left\
        \ alone, and answers with a conflict."
      operationId: resetRulesIndexJob
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexJobStatus"
          description: "The claim was reset, and the index is free"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "Nothing is running, or the running job is within its deadline"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Take back a rules index rebuild that passed its deadline.
      tags:
      - Command
      - Administration
