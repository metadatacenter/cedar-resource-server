          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InclusionSubgraphUpdateReport"
          description: The artifact server refused at least one of the writes; the
            body is the update report
      security:
      - api_key: []
      summary: Update the inclusion subgraph of an artifact
      tags:
      - Command
