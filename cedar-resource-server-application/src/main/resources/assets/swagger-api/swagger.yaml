        pav:lastUpdatedOn:
          type: string
          format: date-time
          description: When the artifact was last changed.
        schema:description:
          type: string
          description: Description shown with the name.
        schema:isBasedOn:
          type: string
          format: uri
          description: IRI of the template the instance was filled in against.
        schema:name:
          type: string
          description: Display name.
    MoveRequest:
