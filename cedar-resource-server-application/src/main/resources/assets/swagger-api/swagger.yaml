        schema:identifier:
          type: string
          description: Reserved for further use. Currently null.
        schema:name:
          type: string
          description: Display name.
        sourceHash:
          type: string
          description: Reserved for further use. Currently null.
    UserListResponse:
      type: object
      description: "Every user of the system, under a single key."
      properties:
        users:
          type: array
          description: "The users, in the order the workspace graph returns them."
          items:
            $ref: "#/components/schemas/User"
    ValidationReport:
      type: object
      description: "What validating an artifact against the CEDAR model found. Returned\
        \ with 200 whether or not the artifact is valid: an invalid artifact is an\
        \ answer, not a failed request. The artifact server produces it, and the resource\
        \ server hands the same document back unchanged."
      properties:
        errors:
          type: array
          description: "Everything that makes the artifact invalid, in the order found."
          items:
            $ref: "#/components/schemas/ErrorItem"
          uniqueItems: true
        validates:
          type: string
          description: "Whether the artifact validates, as a string. One error makes\
            \ it false; warnings alone still validate."
          enum:
          - "true"
          - "false"
        warnings:
          type: array
          description: "Everything the artifact should change but need not, in the\
            \ order found."
          items:
            $ref: "#/components/schemas/WarningItem"
          uniqueItems: true
      required:
      - errors
      - validates
      - warnings
    ValidationRequest:
      type: object
      additionalProperties: true
      description: |
        The artifact to validate. A template, element, field or instance is sent as itself, so its
        own keys are the top-level keys. An instance can instead be paired with the template to
        validate it against, as `schema` and `instance` together.
      properties:
        instance:
          $ref: "#/components/schemas/InstanceArtifactDocument"
        schema:
          $ref: "#/components/schemas/SchemaArtifactDocument"
    ValueSetsImportJob:
      type: object
      additionalProperties: false
      description: |
        What became of one value sets ontology import, or that none has run since this server
        started. `deadlineAt` and `overdue` describe a running import and are empty otherwise.
      properties:
        deadlineAt:
          type: string
          format: date-time
          nullable: true
        failure:
          type: string
          description: "What went wrong, when the status is ERROR."
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        importStatus:
          type: string
          enum:
          - NOT_YET_INITIATED
          - IN_PROGRESS
          - COMPLETE
          - ERROR
        jobId:
          type: string
          nullable: true
        overdue:
          type: boolean
        startedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - importStatus
      - overdue
    WarningItem:
      type: object
      description: "Everything the artifact should change but need not, in the order\
        \ found."
      properties:
        additionalInfo:
          type: object
          additionalProperties:
            type: object
        location:
          type: string
        message:
          type: string
  securitySchemes:
    api_key:
      description: "Your CEDAR API key, using the format 'apiKey <yourApiKey>'"
      in: header
      name: Authorization
      type: apiKey
